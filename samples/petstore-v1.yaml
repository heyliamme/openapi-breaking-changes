openapi: 3.0.3
info:
  title: Petstore
  version: 1.4.0
servers:
  - url: https://api.petstore.example/v1
security:
  - apiKey: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            maximum: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PetStatus'
      responses:
        '200':
          description: A page of pets
          headers:
            X-Next-Page:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '422':
          description: Invalid pet
      callbacks:
        adopted:
          '{$request.body#/callbackUrl}':
            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      required: [petId, adoptedAt]
                      properties:
                        petId:
                          type: string
                        adoptedAt:
                          type: string
                          format: date-time
              responses:
                '204':
                  description: Received
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPet
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Not found
    delete:
      operationId: deletePet
      responses:
        '204':
          description: Deleted
  /stores:
    get:
      operationId: listStores
      deprecated: true
      responses:
        '200':
          description: Stores
  /pets/{petId}/photos:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listPetPhotos
      summary: List a pet's photos
      responses:
        '200':
          description: Photo URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uri
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    PetStatus:
      type: string
      enum: [available, pending, sold]
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64
        tag:
          type: string
        birthday:
          type: string
          format: date
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id, status]
          properties:
            id:
              type: integer
              format: int64
            status:
              $ref: '#/components/schemas/PetStatus'
            owner:
              $ref: '#/components/schemas/Owner'
    Owner:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
